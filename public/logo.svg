<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Sun Glow Gradient -->
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>

    <!-- Compass Needle Gradient -->
    <linearGradient id="needleRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>

    <linearGradient id="needleLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <!-- Wave Gradient -->
    <linearGradient id="waveLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0.9" />
    </linearGradient>

    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Outer Ring Badge -->
  <circle cx="60" cy="60" r="56" fill="url(#bgGrad)" />
  <circle cx="60" cy="60" r="52" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="2" stroke-dasharray="2 3" />

  <!-- Tropical Sun Rising -->
  <circle cx="60" cy="46" r="19" fill="url(#sunGrad)" opacity="0.95" />
  <circle cx="60" cy="46" r="23" fill="#fef08a" opacity="0.2" />

  <!-- Island Mound -->
  <path d="M22 84 C38 68, 82 68, 98 84 Z" fill="#0f766e" />
  <path d="M26 84 C42 72, 78 72, 94 84 Z" fill="#14b8a6" opacity="0.7" />

  <!-- Palm Tree Trunk & Fronds -->
  <!-- Left Palm -->
  <path d="M48 78 Q49 60 56 50 Q54 62 52 78 Z" fill="#78350f" opacity="0.8" />
  <path d="M56 50 Q46 45 38 48 Q47 52 56 50 Z" fill="#15803d" />
  <path d="M56 50 Q48 38 42 39 Q50 44 56 50 Z" fill="#16a34a" />
  <path d="M56 50 Q57 36 64 36 Q61 44 56 50 Z" fill="#22c55e" />
  <path d="M56 50 Q66 43 70 48 Q62 52 56 50 Z" fill="#15803d" />

  <!-- Ocean Waves Layer 1 -->
  <path d="M12 78 Q30 72 48 78 T84 78 T108 78 L108 100 Q90 114 60 116 Q30 114 12 100 Z" fill="#0369a1" />
  <!-- Ocean Waves Layer 2 -->
  <path d="M14 84 C32 80, 44 88, 60 84 C76 80, 88 88, 106 84 L106 100 Q88 114 60 116 Q32 114 14 100 Z" fill="url(#waveLight)" />
  <!-- Ocean Waves Layer 3 Foam -->
  <path d="M18 90 Q36 86 54 90 T90 90 T102 90" stroke="#ffffff" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6" />

  <!-- Compass / Direction Arrow ("Arah") in center-bottom with shadow -->
  <g filter="url(#shadow)" transform="translate(60, 68) rotate(32)">
    <!-- North Pointer (Red) -->
    <polygon points="0,-24 5,0 0,2 -5,0" fill="url(#needleRed)" />
    <!-- South Pointer (White) -->
    <polygon points="0,18 5,0 0,2 -5,0" fill="url(#needleLight)" />
    <!-- Pivot Pin -->
    <circle cx="0" cy="0" r="3.5" fill="#0f172a" />
    <circle cx="0" cy="0" r="1.5" fill="#f8fafc" />
  </g>
</svg>
